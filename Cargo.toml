[package]
name = "hexalith"
version = "0.1.0"
edition = "2021"
description = "Modern geometric logo generator in Rust - creates unique hexagonal designs with minimal configuration"
authors = ["James Brink"]
license = "MIT"
repository = "https://github.com/utensils/hexalith"
keywords = ["logo", "generator", "hexagon", "svg", "design"]
categories = ["command-line-utilities", "graphics"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
uuid = { version = "1.7", features = ["v4", "serde"] }
rand = "0.8"
svg = "0.14"
rand_chacha = "0.3"
tiny-skia = "0.11"
resvg = "0.36"
usvg = "0.36"
arboard = "3.3"
png = "0.17"

# Web server dependencies
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "trace", "cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
maud = "0.26"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.8"
tokio = { version = "1", features = ["full", "test-util"] }
reqwest = { version = "0.11", features = ["json"] }
hyper = { version = "1.0", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"

[lib]
name = "hexalith"
path = "src/lib.rs"

[[bin]]
name = "hexalith"
path = "src/main.rs"

[[bin]]
name = "hexweb"
path = "src/web_main.rs"